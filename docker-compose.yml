services:
  mysql:
    image: mysql:8.4
    container_name: bible_mysql
    restart: always

    env_file:
      - .env

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    networks:
      - bible_network

  backend:
    build:
      context: ./bibleapp

    container_name: bible_backend

    restart: always

    depends_on:
      - mysql

    env_file:
      - .env

    ports:
      - "${SERVER_PORT}:8080"

    volumes:
      - uploads:${APP_UPLOAD_DIR}

    networks:
      - bible_network

  frontend:
    build:
      context: ./bibleapp

    container_name: bible_frontend

    restart: always

    depends_on:
      - backend

    ports:
      - "3000:80"

    networks:
      - bible_network

volumes:
  mysql_data:
  uploads:

networks:
  bible_network:
